name: Ingesta diaria

# El BOE se publica de madrugada; a las 06:30 UTC ya está el sumario del día.
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Cuántos días hacia atrás leer'
        required: false
        default: '7'
  push:
    branches: [claude/public-spending-app-5qq14n, main]
    paths-ignore:
      - 'data/**'
      - '**.md'

permissions:
  contents: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pruebas de los lectores
        run: npm test

      - name: Leer BOE y Plataforma de Contratación
        run: node scripts/build.mjs --dias=${{ github.event.inputs.dias || 7 }}

      - name: Revisar lo generado
        run: node scripts/check.mjs

      - name: Publicar los datos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'Sin cambios en los datos.'
            exit 0
          fi
          git commit -m "Datos oficiales al $(date -u +%Y-%m-%d)"
          git push
