name: Relleno histórico del BOE

# Lee el sumario del BOE día a día hacia atrás y lo funde con lo que ya hay.
# Se lanza a mano desde Actions, o tocando .github/relleno.txt (donde se
# apunta desde qué fecha se quiere rellenar).
on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Fecha desde la que rellenar (AAAA-MM-DD)'
        required: true
        default: '2025-07-01'
  push:
    paths:
      - '.github/relleno.txt'

permissions:
  contents: write

concurrency:
  group: ingesta
  cancel-in-progress: false

jobs:
  relleno:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fecha de inicio
        id: fecha
        run: |
          DESDE='${{ github.event.inputs.desde }}'
          if [ -z "$DESDE" ] && [ -f .github/relleno.txt ]; then
            DESDE=$(grep -Eo '[0-9]{4}-[0-9]{2}-[0-9]{2}' .github/relleno.txt | head -1)
          fi
          echo "desde=${DESDE:-2025-07-01}" >> "$GITHUB_OUTPUT"

      - name: Leer el BOE hacia atrás
        run: node scripts/build.mjs --desde=${{ steps.fecha.outputs.desde }} --solo=boe

      - name: Revisar lo generado
        run: node scripts/check.mjs

      - name: Publicar los datos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo 'Sin cambios en los datos.'
            exit 0
          fi
          git commit -m "Relleno del BOE desde ${{ steps.fecha.outputs.desde }}"
          # Primero se commitea y luego se rebasa: si se hace al revés, los
          # ficheros nuevos sin seguimiento bloquean el pull.
          git fetch origin "${{ github.ref_name }}"
          git rebase -X theirs "origin/${{ github.ref_name }}" || { git rebase --abort; exit 1; }
          git push origin "HEAD:${{ github.ref_name }}"
